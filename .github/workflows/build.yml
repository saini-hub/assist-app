name: Build Gemini Trigger APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Files and Build APK
        run: |
          mkdir -p src/com/offline/geminilauncher obj

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.offline.geminilauncher"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
              <application android:label="Gemini Web Trigger">
                  <activity
                      android:name=".AssistActivity"
                      android:theme="@android:style/Theme.NoDisplay"
                      android:excludeFromRecents="true"
                      android:noHistory="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <action android:name="android.intent.action.VOICE_COMMAND" />
                          <action android:name="android.intent.action.SEARCH_LONG_PRESS" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/offline/geminilauncher/AssistActivity.java
          package com.offline.geminilauncher;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;

          public class AssistActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://gemini.google.com/app"));
                      intent.setComponent(new ComponentName("com.android.chrome", "com.google.android.apps.chrome.Main"));
                      intent.putExtra("com.android.browser.application_id", "com.android.chrome");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      startActivity(intent);
                  } catch (Exception e) {
                      Intent fallback = new Intent(Intent.ACTION_VIEW, Uri.parse("https://gemini.google.com/app"));
                      fallback.setPackage("com.android.chrome");
                      fallback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(fallback);
                  }
                  finish();
                  overridePendingTransition(0, 0);
              }
          }
          EOF

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)

          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM/android.jar" \
            -d obj src/com/offline/geminilauncher/AssistActivity.java

          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --output . \
            obj/com/offline/geminilauncher/AssistActivity.class

          "$BUILD_TOOLS/aapt2" link -o unsigned.apk \
            -I "$PLATFORM/android.jar" \
            --manifest AndroidManifest.xml

          zip -uj unsigned.apk classes.dex
          "$BUILD_TOOLS/zipalign" -f 4 unsigned.apk aligned.apk

          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android,O=Offline,C=IN"

          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out GeminiTrigger.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTrigger-APK
          path: GeminiTrigger.apk
